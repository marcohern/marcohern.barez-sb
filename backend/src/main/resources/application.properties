server.port=8080

# SQLite DataSource
spring.datasource.url=jdbc:sqlite:./data/barez.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=bXlTdXBlclNlY3JldEtleUZvckJhcmV6QXBwMTIzNDU2Nzg5MA==
app.jwt.expiration-ms=86400000

# PDF receipts
app.pdf.storage-path=./data/receipts

# Bar name (used in PDF header)
app.bar.name=Barez

# CORS
app.cors.allowed-origins=http://localhost:5173

logging.level.com.marcohern.barez=INFO
